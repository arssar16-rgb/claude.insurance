<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>KSAMC – متابعة معاملات التأمين</title>
<style>
:root{--bg:#f2f7f7;--card:#fff;--tx:#0f2a2e;--mut:#5f7479;--pri:#0f766e;--on:#fff;--bd:#d8e5e6;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7;--info:#1d4ed8;--infobg:#dbeafe;--soft:#e6f4f2;--sh:0 2px 10px rgba(15,60,60,.08)}
[data-theme=dark]{--bg:#0b1517;--card:#14252a;--tx:#e6f1f2;--mut:#93a9ad;--pri:#2dd4bf;--on:#06201d;--bd:#26404a;--ok:#4ade80;--okbg:#12361f;--bad:#f87171;--badbg:#3f1a1a;--warn:#fbbf24;--warnbg:#3a2e10;--info:#93c5fd;--infobg:#172a4a;--soft:#17333a;--sh:0 2px 10px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.5;overflow-x:hidden}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.bare{padding-bottom:0}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:sticky;top:0;z-index:20;background:var(--pri);color:var(--on);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:18px;margin:0;flex:1}
.top .logo{background:var(--on);color:var(--pri);font-weight:800;font-size:12px;padding:4px 8px;border-radius:8px;letter-spacing:.5px}
.top button{background:rgba(255,255,255,.18);border:0;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;color:var(--on);cursor:pointer;position:relative}
[data-theme=dark] .top button{background:rgba(0,0,0,.18)}
.dot{position:absolute;top:6px;left:6px;width:9px;height:9px;border-radius:50%;background:#f59e0b}
.dot.ok{background:#22c55e}.dot.off{background:#9ca3af}
.wrap{padding:14px;max-width:720px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--card);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--sh)}
.tile b{display:block;font-size:26px;line-height:1.1;color:var(--pri)}
.tile span{font-size:13px;color:var(--mut)}
.tile.bad b{color:var(--bad)}.tile.ok b{color:var(--ok)}
.sbar{display:flex;gap:8px;margin-bottom:12px}
.sin{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:0 12px}
.sin input{flex:1;border:0;background:transparent;outline:0;height:46px;min-width:0}
.ibtn{background:var(--card);border:1px solid var(--bd);border-radius:14px;width:48px;display:grid;place-items:center;position:relative;cursor:pointer}
.ibtn .n{position:absolute;top:-6px;left:-6px;background:var(--pri);color:var(--on);font-size:11px;border-radius:10px;padding:0 6px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);border-inline-start:5px solid var(--pri)}
.card.od{border-inline-start-color:var(--bad)}.card.pr1{border-inline-start-color:#f59e0b}.card.pr2{border-inline-start-color:var(--bad)}.card.dn{border-inline-start-color:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .nm{font-weight:700;font-size:17px}
.sub{color:var(--mut);font-size:14px;margin-top:2px;direction:rtl}
.docl{margin:8px 0;padding:8px 10px;background:var(--soft);border-radius:10px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font-size:12.5px;padding:3px 10px;border-radius:20px;background:var(--soft);color:var(--tx);white-space:nowrap}
.sg{border:1px solid var(--bd);background:var(--card);color:var(--pri);font-size:14px;padding:7px 12px;border-radius:20px;cursor:pointer;font-weight:600}.sg:active{background:var(--soft)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.info{background:var(--infobg);color:var(--info)}
.last{font-size:13.5px;color:var(--mut);margin:6px 0 10px}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{border:0;border-radius:12px;min-height:46px;padding:8px 10px;background:var(--soft);color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px}
.btn.p{background:var(--pri);color:var(--on)}.btn.ok{background:var(--ok);color:#fff}.btn.wa{background:#25d366;color:#053b1b}.btn.bad{background:var(--badbg);color:var(--bad)}.btn.line{background:transparent;border:1px solid var(--bd)}
.btn.big{min-height:52px;font-size:16px;width:100%}
.btn:disabled{opacity:.5}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(86px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--pri);color:var(--on);font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:15;cursor:pointer}
nav{position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
body.bare nav{display:none}
nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut);padding:6px 0;cursor:pointer;border-radius:12px}
nav button.on{color:var(--pri);font-weight:700}
nav button.on svg{stroke-width:2.6}
.sec{background:var(--card);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
.sec h3{margin:0 0 10px;font-size:16px;color:var(--pri)}
label.f{display:block;margin-bottom:12px;font-size:14px;color:var(--mut)}
label.f b{color:var(--bad)}
.in,select.in,textarea.in{display:block;width:100%;margin-top:4px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:16px;color:var(--tx);outline:0}
.in:focus{border-color:var(--pri)}
textarea.in{min-height:80px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:var(--sh)}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:15px}
.kv:last-child{border:0}.kv span:first-child{color:var(--mut)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.tl{border-inline-start:2px solid var(--bd);margin-inline-start:6px;padding-inline-start:14px}
.tl div{position:relative;margin-bottom:12px;font-size:14.5px}
.tl div:before{content:"";position:absolute;inset-inline-start:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--pri)}
.tl small{display:block;color:var(--mut);font-size:12px}
#toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));inset-inline:16px;margin:auto;max-width:420px;background:#111c1e;color:#fff;padding:12px 16px;border-radius:14px;z-index:90;text-align:center;opacity:0;pointer-events:none;transition:.25s;font-size:15px}
#toast.on{opacity:1}
#loader{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:95;display:none;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
#loader.on{display:flex}
#loader div{background:var(--card);color:var(--tx);border-radius:18px;padding:20px;width:min(320px,90vw)}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth .box{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:420px;box-shadow:var(--sh)}
.auth h2{margin:0 0 4px;color:var(--pri)}
.auth p{color:var(--mut);font-size:14px;margin:0 0 14px}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.okbox{background:var(--okbg);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.att{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:14px}
.att span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att button{background:none;border:0;color:var(--pri);cursor:pointer;padding:4px}
.tag{font-size:11px;background:var(--warnbg);color:var(--warn);padding:1px 7px;border-radius:10px;margin-inline-start:6px}
pre.code{direction:ltr;text-align:left;background:var(--bg);border-radius:10px;padding:10px;font-size:12px;overflow:auto;white-space:pre-wrap;user-select:all}
.small{font-size:13px;color:var(--mut)}
</style>

<body>
<div id="screen"></div>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="loader"><div id="loaderBox"></div></div>
<div id="toast"></div>

<script type="module">
/* ================================================================
   KSAMC – متابعة معاملات التأمين الطبي
   ملف واحد، يعمل محليًا على الجوال بدون خادم ولا مزامنة.
   البيانات محفوظة داخل متصفح الجهاز فقط.
   ================================================================ */

/*PURE-START*/
const TYPES=['إدارية','طبية','حوادث وإصابات عمل'];
const STATUSES=['تحت الإجراء','بانتظار رد التأمين','بانتظار القسم','تم الإنجاز'];
const PRIOS=['عادية','عاجلة','عاجلة جدًا'];
const DONE='تم الإنجاز';
const DEFAULT_DOCS=['صورة جواز السفر','ختم الدخول','التأشيرة','التحويل','تقرير المرور','صورة الهوية الوطنية','صورة الإقامة','تقرير طبي مفصل','تقرير إصابة عمل','تقرير الحادث','تقرير الأشعة','نتائج المختبر','تقرير العملية','تقرير الخروج','وصفة العلاج','بطاقة التأمين','خطاب تحويل','فاتورة العلاج'];
const DEFAULT_WA=`السلام عليكم ورحمة الله وبركاته،

تحية طيبة وبعد،

نفيدكم بأنه لاستكمال متطلبات المعاملة التأمينية الخاصة بالمريض لدى مدينة الملك سلمان الطبية، نأمل منكم التكرم بتزويدنا بالمستند المطلوب أدناه، وذلك لإرفاقه لدى شركة التأمين واستكمال الإجراءات اللازمة.

*اسم المريض:* {اسم_المريض}

*رقم الملف الطبي:* {رقم_الملف}

*المستند المطلوب:* {المستند_المطلوب}

نأمل إرسال المستند المذكور في أقرب وقت ممكن، حرصًا على سرعة استكمال الإجراءات التأمينية.

شاكرين لكم حسن تعاونكم وتقديركم.

مدينة الملك سلمان الطبية
ضابط الاتصال التأميني`;

const enc=new TextEncoder(),dec=new TextDecoder();
const b64=buf=>{let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encBytes(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes));const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return b64(out)}
async function decBytes(key,s){const a=unb64(s);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(0,12)},key,a.slice(12)))}
const encJSON=(k,o)=>encBytes(k,enc.encode(JSON.stringify(o)));
const decJSON=async(k,s)=>JSON.parse(dec.decode(await decBytes(k,s)));

function normDigits(s){return String(s??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))}
function normMobile(s){let m=normDigits(s).replace(/[\s\-().]/g,'');if(/^\+?9665\d{8}$/.test(m))m='0'+m.replace(/^\+?966/,'');if(/^5\d{8}$/.test(m))m='0'+m;return m}
function waNumber(mobile){let m=normDigits(mobile).replace(/[^\d]/g,'');if(!m)return null;if(m.startsWith('00'))m=m.slice(2);else if(/^05\d{8}$/.test(m))m='966'+m.slice(1);else if(/^5\d{8}$/.test(m))m='966'+m;else if(/^0\d+$/.test(m))m='966'+m.slice(1);return m.length>=9?m:null}
function fillTemplate(tpl,t){return String(tpl).split('{اسم_المريض}').join(t.name||'').split('{رقم_الملف}').join(t.mrn||'').split('{المستند_المطلوب}').join(t.doc||'')}
function fmtDur(ms){if(!(ms>=0))return '—';const m=Math.floor(ms/6e4),d=Math.floor(m/1440),h=Math.floor(m%1440/60);if(d>0)return h?`${d} يوم و${h} ساعة`:`${d} يوم`;if(h>0)return `${h} ساعة`;return `${m} دقيقة`}

function parseEmail(raw){
  const text=normDigits(raw||'').replace(/\r/g,'');
  const lines=text.split('\n').map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
  const res={name:'',mrn:'',mobile:'',doc:'',warnings:[]};
  if(!lines.length)return res;
  const subjIdx=lines.findIndex(l=>/^(subject|الموضوع|re:|fw:|fwd:)/i.test(l));
  const subj=(subjIdx>=0?lines.slice(subjIdx,subjIdx+2):lines.slice(0,3)).join(' ');
  const foot=lines.slice(Math.max(subjIdx>=0?subjIdx+2:3,lines.length-14)).join('\n');
  const rxMrn=/(?:patient\s*mrn|mrn|رقم\s*الملف(?:\s*الطبي)?)\s*[:：#\-]?\s*(\d{4,12})/i;
  const rxMob=/(?:mobile|phone|tel|رقم\s*الجوال|الجوال|جوال)\s*[:：]?\s*(\+?\d[\d\s\-]{7,14}\d)/i;
  const rxName=/(?:patient\s*name|اسم\s*المريض|name)\s*[:：]\s*([^\n]+?)(?=\s+(?:patient\s*mrn|mrn|mobile|phone|رقم|الجوال|id\b)|\s*[|;,،]|\s*$)/i;
  const pick=(rx,a,b)=>{const x=(a.match(rx)||[])[1],y=(b.match(rx)||[])[1];return[x?x.trim():'',y?y.trim():'']};
  const clean=s=>s.replace(/[\d_|]+/g,' ').replace(/\s+/g,' ').replace(/^[\s\-–:]+|[\s\-–:]+$/g,'').trim();
  let [sm,fm]=pick(rxMrn,subj,foot);
  if(sm&&fm&&sm!==fm)res.warnings.push(`رقم الملف في العنوان (${sm}) يختلف عن أسفل الرسالة (${fm})`);
  res.mrn=fm||sm||'';
  let [sn,fn]=pick(rxName,subj,foot);sn=clean(sn);fn=clean(fn);
  if(sn&&fn&&sn.replace(/\s/g,'').toLowerCase()!==fn.replace(/\s/g,'').toLowerCase())res.warnings.push(`اسم المريض في العنوان (${sn}) يختلف عن أسفل الرسالة (${fn})`);
  res.name=fn||sn||'';
  let [so,fo]=pick(rxMob,subj,foot);so=so?normMobile(so):'';fo=fo?normMobile(fo):'';
  if(so&&fo&&so!==fo)res.warnings.push(`رقم الجوال في العنوان (${so}) يختلف عن أسفل الرسالة (${fo})`);
  res.mobile=fo||so||'';
  if(!res.mobile){const all=[...new Set((text.match(/(?<!\d)(?:\+?966|0)?5\d{8}(?!\d)/g)||[]).map(normMobile))];if(all.length===1)res.mobile=all[0]}
  const stop=/(?:\.|،|؛|;|\s+وذلك|\s+لاستكمال|\s+للمريض|\s+الخاص|\s+الخاصة|\s+لدى|\s+حتى|\s+في\s+أقرب)/;
  const rxDoc=/(?:المستند\s*المطلوب|المستندات\s*المطلوبة|المطلوب|(?:يرجى|نرجو|نأمل|الرجاء)\s*(?:منكم\s*)?(?:تزويدنا|تزويد|إرفاق|ارفاق|إرسال|ارسال)\s*(?:بـ|ب)?|تزويدنا\s*(?:بـ|ب))\s*[:：\-]?\s*(.*)$/;
  for(let i=0;i<lines.length&&!res.doc;i++){
    const m=lines[i].match(rxDoc);if(!m)continue;
    let r=m[1].trim();if(!r&&lines[i+1]&&!/(?:mrn|mobile|patient)/i.test(lines[i+1]))r=lines[i+1];
    r=r.split(stop)[0].trim().replace(/^[\-:،.\s]+|[\-:،.\s]+$/g,'');
    if(r.length>=3&&/[\u0600-\u06FFA-Za-z]/.test(r))res.doc=r.slice(0,140);
  }
  if(!res.mrn)res.warnings.push('لم يتم التعرف على رقم الملف الطبي');
  if(!res.name)res.warnings.push('لم يتم التعرف على اسم المريض');
  if(!res.mobile)res.warnings.push('لم يتم التعرف على رقم الجوال');
  if(!res.doc)res.warnings.push('لم يتم التعرف على المستند المطلوب');
  return res;
}
/*PURE-END*/

/* ============================ أدوات عامة ============================ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid8=()=>crypto.getRandomValues(new Uint32Array(2)).reduce((a,b)=>a+b.toString(36),'');
const nowISO=()=>new Date().toISOString();
const todayStr=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
const ST=Object.assign({theme:null,overdue:48,wa:DEFAULT_WA,docs:DEFAULT_DOCS},LS.get('ksamc_settings',{}));
const saveST=()=>LS.set('ksamc_settings',ST);

const fmtD=iso=>{if(!iso)return '—';try{return new Date(iso).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'short',year:'numeric'})}catch{return iso}};
const ago=iso=>{const ms=Date.now()-new Date(iso);return ms<6e4?'الآن':'منذ '+fmtDur(ms)};

/* ============================ قاعدة البيانات المحلية (IndexedDB) ============================ */
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const DB={db:null,
  open(scope){return new Promise((res,rej)=>{const r=indexedDB.open('ksamc-ins-'+scope,1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('tx',{keyPath:'id'});d.createObjectStore('att',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'k'})};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  s(st,mode='readonly'){return this.db.transaction(st,mode).objectStore(st)},
  getAll(st){return rq(this.s(st).getAll())},get(st,k){return rq(this.s(st).get(k))},
  put(st,v){return rq(this.s(st,'readwrite').put(v))},del(st,k){return rq(this.s(st,'readwrite').delete(k))}};

/* ============================ الحالة ============================ */
const S={view:'home',archTab:'list',f:{q:'',status:'',prio:'',type:''},ready:false,tx:[],recs:new Map(),editId:null,formAtt:[],removedAtt:[]};
const live=t=>!t.deleted,isDone=t=>t.status===DONE,isOverdue=t=>!isDone(t)&&Date.now()-new Date(t.receivedAt)>ST.overdue*36e5;
const byId=id=>S.tx.find(t=>t.id===id);
const prioIdx=t=>Math.max(0,PRIOS.indexOf(t.priority));
const lastAct=t=>t.log&&t.log.length?t.log[t.log.length-1]:null;

/* ============================ الحفظ (مشفّر على الجهاز) ============================ */
async function persist(t){
  t.updatedAt=nowISO();
  const rec={id:t.id,data:t,updatedAt:t.updatedAt};
  S.recs.set(t.id,rec);await DB.put('tx',rec);
  const i=S.tx.findIndex(x=>x.id===t.id);if(i<0)S.tx.push(t);else S.tx[i]=t;
}

/* ============================ المرفقات ============================ */
async function fileToBytes(file){
  if(file.type.startsWith('image/')){
    const bmp=await createImageBitmap(file).catch(()=>null);
    if(bmp){let w=bmp.width,h=bmp.height;const mx=1600,sc=Math.min(1,mx/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(bmp,0,0,w,h);
      for(const q of [.72,.6,.5,.4]){const bl=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));if(bl.size<=640*1024||q===.4)return{bytes:new Uint8Array(await bl.arrayBuffer()),type:'image/jpeg',name:file.name.replace(/\.\w+$/,'')+'.jpg'}}}
  }
  return{bytes:new Uint8Array(await file.arrayBuffer()),type:file.type||'application/octet-stream',name:file.name};
}
async function makeAtt(file){
  const {bytes,type,name}=await fileToBytes(file);
  if(bytes.length>4*1024*1024)throw new Error('الملف كبير جدًا (الحد 4MB)');
  const id=uid8();
  return{meta:{id,name,type,size:bytes.length},rec:{id,data:bytes}};
}
async function getAttBlob(a){
  let rec=await DB.get('att',a.id);
  if(!rec)throw new Error('المرفق غير متوفر');
  return new Blob([rec.data],{type:a.type});
}
async function viewAtt(id,tid){
  const t=byId(tid),a=t.attachments.find(x=>x.id===id);loading(true,'<b>جارٍ فتح المرفق…</b>');
  try{const bl=await getAttBlob(a),url=URL.createObjectURL(bl);loading(false);
    if(a.type.startsWith('image/'))openSheet(`<h2>${esc(a.name)}<button class="btn" data-act="closeSheet">${ico('x')}</button></h2><img src="${url}" style="width:100%;border-radius:12px"><a class="btn p big" style="margin-top:10px;text-decoration:none" href="${url}" download="${esc(a.name)}">تنزيل</a>`);
    else{const w=window.open(url,'_blank');if(!w){const l=document.createElement('a');l.href=url;l.download=a.name;l.click()}}
  }catch(e){loading(false);toast(e.message)}
}

/* ============================ فتح التطبيق ============================ */
async function openApp(){
  await DB.open('local');
  S.recs.clear();S.tx=[];
  for(const r of await DB.getAll('tx')){S.recs.set(r.id,r);if(r.data)S.tx.push(r.data)}
  S.ready=true;document.body.classList.remove('bare');S.view='home';renderNav();render();
}

function header(title){

  <button data-act="theme" aria-label="الوضع">${ico(document.documentElement.dataset.theme==='dark'?'sun':'moon')}</button>
</div>`;

function render(keepScroll){

const refreshView=()=>{if(!S.ready)return;if(S.view==='add'||S.view==='settings'){return}render(true)};
const searchBar=()=>{const n=['status','prio','type'].filter(k=>S.f[k]).length;return `<div class="sbar"><div class="sin">${ico('search')}<input id="q" type="search" placeholder="بحث بالاسم أو رقم الملف أو الجوال" value="${esc(S.f.q)}" autocomplete="off"></div><button class="ibtn" data-act="filters" aria-label="تصفية">${ico('filter')}${n?`<span class="n">${n}</span>`:''}</button></div>`};
function calcStats(list){
  const done=list.filter(isDone),active=list.filter(t=>!isDone(t)),od=active.filter(isOverdue);
  const durs=done.filter(t=>t.doneAt).map(t=>new Date(t.doneAt)-new Date(t.receivedAt)).filter(x=>x>=0);
  const cnt=(arr,k)=>Object.fromEntries(arr.map(a=>[a,list.filter(t=>t[k]===a).length]));
  return{total:list.length,active:active.length,done:done.length,overdue:od.length,rate:list.length?done.length/list.length:0,avg:durs.length?durs.reduce((a,b)=>a+b,0)/durs.length:null,byType:cnt(TYPES,'type'),byStatus:cnt(STATUSES,'status'),byPrio:cnt(PRIOS,'priority')};
}
function viewHome(){
  const st=calcStats(S.tx.filter(live));
  return `${header('الرئيسية')}<div class="wrap"><div class="tiles"><div class="tile"><b>${st.active}</b><span>نشطة</span></div><div class="tile bad"><b>${st.overdue}</b><span>متأخرة</span></div><div class="tile ok"><b>${st.done}</b><span>منجزة</span></div></div>${searchBar()}<div id="lst"></div></div><button class="fab" data-act="new" aria-label="إضافة">+</button>`;
}
const viewList=()=>`${header('كل المعاملات')}<div class="wrap">${searchBar()}<div id="lst"></div></div><button class="fab" data-act="new" aria-label="إضافة">+</button>`;
function viewArchive(){
  return `${header('الأرشيف والتقارير')}<div class="wrap"><div class="seg"><button data-act="atab" data-id="list" class="${S.archTab==='list'?'on':''}">الأرشيف</button><button data-act="atab" data-id="stats" class="${S.archTab==='stats'?'on':''}">الإحصائيات</button></div>
  ${S.archTab==='list'?`${searchBar()}<div id="lst"></div>`:statsHTML()}</div>`;
}
function statsHTML(){
  const st=calcStats(S.tx.filter(live)),mx=o=>Math.max(1,...Object.values(o));
  const bars=(o,t)=>`<div class="sec"><h3>${t}</h3>${Object.entries(o).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${v}</b></div><div class="bar"><i style="width:${v/mx(o)*100}%"></i></div>`).join('')}</div>`;
  return `<div class="tiles"><div class="tile"><b>${st.total}</b><span>الإجمالي</span></div><div class="tile ok"><b>${Math.round(st.rate*100)}%</b><span>نسبة الإنجاز</span></div><div class="tile bad"><b>${st.overdue}</b><span>متأخرة</span></div></div>
  <div class="sec"><div class="kv"><span>المعاملات النشطة</span><b>${st.active}</b></div><div class="kv"><span>المعاملات المنجزة</span><b>${st.done}</b></div><div class="kv"><span>متوسط مدة الإنجاز</span><b>${st.avg==null?'—':fmtDur(st.avg)}</b></div></div>
  ${bars(st.byType,'حسب نوع الطلب')}${bars(st.byStatus,'حسب الحالة')}${bars(st.byPrio,'حسب الأولوية')}
  <button class="btn p big" data-act="export">${ico('download')} تصدير تقرير Excel</button>`;
}
function matches(t){
  const q=normDigits(S.f.q).trim().toLowerCase();
  if(q&&!(`${t.name} ${t.mrn} ${t.mobile} ${t.doc}`.toLowerCase().includes(q)))return false;
  if(S.f.status&&t.status!==S.f.status)return false;if(S.f.prio&&t.priority!==S.f.prio)return false;if(S.f.type&&t.type!==S.f.type)return false;return true;
}
function updateList(){
  const el=$('#lst');if(!el)return;const v=S.view;
  let arr=S.tx.filter(live);
  if(v==='home')arr=arr.filter(t=>!isDone(t));
  if(v==='archive')arr=arr.filter(isDone);
  arr=arr.filter(matches);
  if(v==='home')arr.sort((a,b)=>isOverdue(b)-isOverdue(a)||prioIdx(b)-prioIdx(a)||new Date(a.receivedAt)-new Date(b.receivedAt));
  else if(v==='archive')arr.sort((a,b)=>new Date(b.doneAt||0)-new Date(a.doneAt||0));
  else arr.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
  el.innerHTML=arr.length?arr.map(card).join(''):`<div class="empty">${v==='home'?'لا توجد معاملات نشطة 🎉':'لا توجد نتائج'}</div>`;
}
function card(t){
  const od=isOverdue(t),la=lastAct(t),pc=['','warn','bad'][prioIdx(t)];
  return `<div class="card ${isDone(t)?'dn':od?'od':'pr'+prioIdx(t)}">
  <div class="row"><div><div class="nm">${esc(t.name)}</div><div class="sub">ملف: <span dir="ltr">${esc(t.mrn)}</span> · <span dir="ltr">${esc(t.mobile)}</span></div></div><span class="chip ${isDone(t)?'ok':'info'}">${esc(t.status)}</span></div>
  <div class="docl">📄 ${esc(t.doc)}</div>
  <div class="chips"><span class="chip ${pc}">${esc(t.priority)}</span><span class="chip">${esc(t.type)}</span>${od?'<span class="chip bad">متأخرة</span>':''}<span class="chip">طُلبت ${fmtD(t.receivedAt)}</span>${t.attachments?.length?`<span class="chip">${t.attachments.length} مرفق</span>`:''}</div>
  <div class="last">آخر إجراء: ${esc(la?la.text:'—')}${la?` · ${ago(la.t)}`:''}</div>
  <div class="btns"><button class="btn" data-act="detail" data-id="${t.id}">${ico('info')}</button><button class="btn" data-act="edit" data-id="${t.id}">${ico('edit')}</button><button class="btn wa" data-act="wa" data-id="${t.id}">${ico('wa')}</button>${isDone(t)?`<button class="btn line" data-act="reopen" data-id="${t.id}">${ico('refresh')}</button>`:`<button class="btn ok" data-act="done" data-id="${t.id}">${ico('check')}</button>`}</div></div>`;
}
function openFilters(){

  const sts=S.view==='home'?STATUSES.filter(x=>x!==DONE):STATUSES;

const val=id=>($('#'+id)?.value||'').trim();
async function saveForm(){
  const old=S.editId?byId(S.editId):null;
  const d={name:val('fName'),mrn:normDigits(val('fMrn')).replace(/\s/g,''),mobile:normMobile(val('fMob')),doc:val('fDoc'),type:val('fType'),priority:val('fPrio'),status:val('fStat'),sender:val('fSend'),notes:val('fNotes'),receivedAt:val('fRec')?new Date(val('fRec')).toISOString():nowISO()};
  if(!d.name||!d.mrn||!d.mobile||!d.doc)return toast('أكمل الحقول الإلزامية: الاسم، رقم الملف، الجوال، المستند');
  if(!/^(05\d{8}|\+?\d{9,15})$/.test(d.mobile)&&!await ask('رقم الجوال','الرقم المدخل لا يبدو صحيحًا. هل تريد المتابعة؟','متابعة'))return;
  const nd=s=>s.replace(/\s+/g,' ').trim().toLowerCase();
  const dup=S.tx.find(t=>live(t)&&t.id!==(old&&old.id)&&t.mrn===d.mrn&&nd(t.doc)===nd(d.doc));

  if(!old&&d.status!==STATUSES[0])L(`الحالة الابتدائية: ${d.status}`);
  Object.assign(t,d);

/* ---------- OCR ---------- */
async function preprocess(file){
  const bmp=await createImageBitmap(file);const sc=Math.min(2.2,2400/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);const cx=cv.getContext('2d');cx.drawImage(bmp,0,0,cv.width,cv.height);
  const im=cx.getImageData(0,0,cv.width,cv.height),p=im.data;
  for(let i=0;i<p.length;i+=4){let g=.299*p[i]+.587*p[i+1]+.114*p[i+2];g=(g-128)*1.35+128;g=g<0?0:g>255?255:g;p[i]=p[i+1]=p[i+2]=g}
  cx.putImageData(im,0,0);return cv;
}
async function runOCR(file){
  loading(true,'<b>قراءة الإيميل…</b><div class="bar" style="margin-top:12px"><i id="ocrBar" style="width:3%"></i></div><p class="small" id="ocrMsg">تحميل محرك القراءة (أول مرة فقط)</p>');
  let worker;
  try{
    if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    const cv=await preprocess(file);
    worker=await Tesseract.createWorker(['ara','eng'],1,{logger:m=>{const b=$('#ocrBar');if(b&&m.progress!=null){b.style.width=Math.max(3,Math.round(m.progress*100))+'%';$('#ocrMsg').textContent=({'recognizing text':'جارٍ التعرف على النص','loading language traineddata':'تحميل بيانات اللغة'}[m.status]||m.status)}}});
    const {data}=await worker.recognize(cv);
    loading(false);
    const r=parseEmail(data.text);
    const set=(id,v)=>{if(v)$('#'+id).value=v};set('fName',r.name);set('fMrn',r.mrn);set('fMob',r.mobile);set('fDoc',r.doc);
    try{const a=await makeAtt(file);S.formAtt.push(a);$('#attList').innerHTML+=`<div class="att">${ico('clip')}<span>${esc(a.meta.name)}</span><button data-act="rmatt" data-id="${a.meta.id}">${ico('trash')}</button></div>`}catch{}
    $('#ocrOut').innerHTML=`<div class="${r.warnings.length?'warnbox':'okbox'}" style="margin-top:10px"><b>${r.warnings.length?'راجع البيانات قبل الحفظ:':'تم استخراج البيانات. راجعها قبل الحفظ.'}</b>${r.warnings.map(w=>`<div>• ${esc(w)}</div>`).join('')}</div><details><summary class="small">النص المقروء كاملًا</summary><pre class="code" style="direction:rtl;text-align:right">${esc(data.text)}</pre></details>`;
  }catch(e){loading(false);toast('تعذرت القراءة: '+e.message)}
  finally{if(worker)worker.terminate()}
}

  put(r++,'نسبة الإنجاز',st.rate,false,'0.0%');put(r++,'متوسط مدة الإنجاز',st.avg==null?'—':fmtDur(st.avg));
  r++;put(r++,'نوع الطلب','العدد',true);Object.entries(st.byType).forEach(([a,b])=>put(r++,a,b));
  r++;put(r++,'الحالة','العدد',true);Object.entries(st.byStatus).forEach(([a,b])=>put(r++,a,b));
  r++;put(r++,'الأولوية','العدد',true);Object.entries(st.byPrio).forEach(([a,b])=>put(r++,a,b));
  w2.getColumn(1).width=36;w2.getColumn(2).width=24;
  // 3
  const w3=wb.addWorksheet('سجل التحديثات',{views:[{rightToLeft:true,state:'frozen',ySplit:3}]});
  const H3=['رقم الملف','اسم المريض','تاريخ التحديث','تفاصيل الإجراء'];title(w3,4,'KSAMC – سجل التحديثات',sub);w3.getRow(3).values=H3;head(w3,3,4);
  const lg=[];sorted.forEach(t=>t.log.forEach(l=>lg.push([String(t.mrn),t.name,asLocalDate(l.t),l.text])));lg.sort((a,b)=>a[2]-b[2]);
  lg.forEach((v,i)=>{const row=w3.getRow(4+i);row.values=v;row.eachCell({includeEmpty:true},(c,ci)=>{c.alignment=al;c.border=bd;if(ci===1)c.numFmt='@';if(ci===3)c.numFmt='yyyy-mm-dd hh:mm'})});
  widths(w3,[H3,...lg],12,60);w3.autoFilter={from:{row:3,column:1},to:{row:3+Math.max(1,lg.length),column:4}};
  return new Blob([await wb.xlsx.writeBuffer()],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000)}
async function doExport(){
  const mode=(document.querySelector('input[name=xr]:checked')||{}).value||'all';let list=S.tx.filter(live),label='جميع المعاملات';
  if(mode==='active'){list=list.filter(t=>!isDone(t));label='المعاملات النشطة'}
  else if(mode==='done'){list=list.filter(isDone);label='المعاملات المنجزة'}
  else if(mode==='range'){const f=$('#xFrom').value,t=$('#xTo').value;if(!f||!t)return toast('حدد تاريخ البداية والنهاية');const a=new Date(f+'T00:00:00'),b=new Date(t+'T23:59:59');list=list.filter(x=>{const d=new Date(x.receivedAt);return d>=a&&d<=b});label=`الفترة من ${f} إلى ${t}`}
  if(!list.length)return toast('لا توجد معاملات ضمن النطاق المحدد');
  loading(true,'<b>جارٍ إنشاء ملف Excel…</b>');
  try{const bl=await buildXlsx(list,label),name=`KSAMC-report-${todayStr()}.xlsx`;loading(false);downloadBlob(bl,name);
    const file=new File([bl],name,{type:bl.type});const can=navigator.canShare&&navigator.canShare({files:[file]});
    $('#xOut').innerHTML=`<div class="okbox" style="margin-top:12px">تم إنشاء الملف (${list.length} معاملة). إن لم يبدأ التنزيل استخدم الأزرار أدناه.</div><div class="g2"><button class="btn big" id="xDl">تنزيل مرة أخرى</button>${can?`<button class="btn big" id="xSh">مشاركة / حفظ</button>`:'<span></span>'}</div>`;
    $('#xDl').onclick=()=>downloadBlob(bl,name);if(can)$('#xSh').onclick=()=>navigator.share({files:[file]}).catch(()=>{});
  }catch(e){loading(false);toast('فشل التصدير: '+e.message)}
}

/* ============================ الأحداث ============================ */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  if(a==='sheetbg'){if(e.target===el)closeSheet();return}
  if(el.tagName==='A')e.preventDefault();
  switch(a){
    case 'closeSheet':closeSheet();break;
    case 'nav':if(id==='add'){S.editId=null;S.formAtt=[];S.removedAtt=[]}S.view=id;render();break;
    case 'new':S.editId=null;S.formAtt=[];S.removedAtt=[];S.view='add';render();break;
    case 'edit':closeSheet();S.editId=id;S.formAtt=[];S.removedAtt=[];S.view='add';render();break;
    case 'cancelform':S.editId=null;S.formAtt=[];S.removedAtt=[];S.view='home';render();break;
    case 'save':saveForm();break;
    case 'detail':openDetail(id);break;
    case 'addlog':addLog(id);break;
    case 'done':markDone(id);break;case 'reopen':reopen(id);break;case 'del':delTx(id);break;
    case 'wa':openWA(id);break;
    case 'wacopy':copyText($('#waMsg').value);break;
    case 'waopen':{const t=byId(id),n=waNumber(t.mobile);if(!n)return toast('رقم الجوال غير صالح للواتساب');
      const w=window.open(`https://wa.me/${n}?text=${encodeURIComponent($('#waMsg').value)}`,'_blank');
      await persist({...t,log:[...t.log,{id:uid8(),t:nowISO(),text:'فتح واتساب لإرسال طلب المستند'}]});refreshView();if(!w)toast('اسمح بفتح النوافذ المنبثقة');break}
    case 'filters':openFilters();break;
    case 'fapply':S.f.status=$('#fs').value;S.f.prio=$('#fp').value;S.f.type=$('#ft').value;closeSheet();render(true);break;
    case 'fclear':S.f.status=S.f.prio=S.f.type='';closeSheet();render(true);break;
    case 'atab':S.archTab=id;render(true);break;
    case 'theme':ST.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';saveST();applyTheme();render(true);break;
    case 'ocr':$('#ocrFile').click();break;
    case 'addatt':$('#attFile').click();break;
    case 'rmatt':{const i=S.formAtt.findIndex(x=>x.meta.id===id);if(i>=0)S.formAtt.splice(i,1);else S.removedAtt.push(id);el.closest('.att').remove();break}
    case 'viewatt':viewAtt(id,el.dataset.tid);break;
    case 'export':openExport();break;case 'xgo':doExport();break;
    case 'sugg':{const f=$('#fDoc'),v=el.dataset.v,cur=f.value.trim();if(!cur)f.value=v;else if(!cur.split('،').map(x=>x.trim()).includes(v))f.value=cur+'، '+v;break}
    case 'docsave':ST.docs=$('#sDocs').value.split('\n').map(x=>x.trim()).filter(Boolean);saveST();toast('تم حفظ الاقتراحات');break;
    case 'docreset':ST.docs=[...DEFAULT_DOCS];saveST();$('#sDocs').value=ST.docs.join('\n');toast('أُعيدت الاقتراحات الافتراضية');break;
    case 'savegen':ST.overdue=Math.max(1,+$('#sOd').value||48);saveST();toast('تم الحفظ');break;
    case 'wasave':ST.wa=$('#sWa').value;saveST();toast('تم حفظ القالب');break;
    case 'wareset':ST.wa=DEFAULT_WA;saveST();$('#sWa').value=DEFAULT_WA;toast('أُعيد القالب الافتراضي');break;
    case 'bkexp':backupExport();break;case 'bkimp':$('#bkFile').click();break;
    case 'demo':await demoData();render(true);break;
    case 'demodel':{const d=S.tx.filter(t=>t.demo&&live(t));if(!d.length)return toast('لا توجد بيانات وهمية');if(!await ask('حذف الوهمية',`حذف ${d.length} معاملة وهمية؟`,'حذف',true))break;for(const t of d)await persist({...t,deleted:true});toast('تم حذفها');render(true);break}
    case 'wipe':if(await ask('مسح بيانات الجوال','سيتم حذف كل المعاملات من هذا الجوال نهائيًا ولا توجد نسخة أخرى. هل أخذت نسخة احتياطية؟','مسح',true)){DB.db.close();await new Promise(r=>{const q=indexedDB.deleteDatabase('ksamc-ins-local');q.onsuccess=q.onerror=q.onblocked=r});toast('تم المسح');await openApp()}break;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.f.q=e.target.value;updateList()}});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='ocrFile'&&t.files[0]){const f=t.files[0];t.value='';runOCR(f)}
  if(t.id==='attFile'&&t.files.length){loading(true,'<b>جارٍ تجهيز المرفقات…</b>');try{for(const f of t.files){const a=await makeAtt(f);S.formAtt.push(a);$('#attList').insertAdjacentHTML('beforeend',`<div class="att">${ico('clip')}<span>${esc(a.meta.name)}</span><button data-act="rmatt" data-id="${a.meta.id}">${ico('trash')}</button></div>`)}}catch(x){toast(x.message)}loading(false);t.value=''}
  if(t.id==='bkFile'&&t.files[0]){const f=t.files[0];t.value='';backupImport(f)}
});
setInterval(()=>{if(S.ready&&(S.view==='home'||S.view==='list'))updateList()},60000);

/* ============================ PWA ============================ */
function setupPWA(){
  try{const mk=n=>{const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');x.fillStyle='#0f766e';x.fillRect(0,0,n,n);x.fillStyle='#fff';const u=n/10;x.fillRect(4*u,2*u,2*u,6*u);x.fillRect(2*u,4*u,6*u,2*u);return c.toDataURL('image/png')};
    const i180=mk(180),l=document.createElement('link');l.rel='apple-touch-icon';l.href=i180;document.head.appendChild(l);
    const i=document.createElement('link');i.rel='icon';i.href=i180;document.head.appendChild(i);
    const man={name:'KSAMC – متابعة معاملات التأمين',short_name:'KSAMC تأمين',start_url:location.href.split('#')[0],display:'standalone',dir:'rtl',lang:'ar',background_color:'#0f766e',theme_color:'#0f766e',icons:[{src:mk(192),sizes:'192x192',type:'image/png'},{src:mk(512),sizes:'512x512',type:'image/png'}]};
    const m=document.createElement('link');m.rel='manifest';m.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));document.head.appendChild(m)}catch{}
}

/* ============================ الإقلاع ============================ */
async function boot(){
  applyTheme();setupPWA();
  if(!window.indexedDB||!crypto.subtle){document.body.innerHTML='<p style="padding:30px;text-align:center">هذا المتصفح لا يدعم التشفير أو التخزين المطلوب. استخدم متصفحًا حديثًا عبر HTTPS.</p>';return}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
  await openApp();
}
boot().catch(e=>{console.error(e);document.body.innerHTML='<p style="padding:30px;text-align:center">خطأ في التشغيل: '+esc(e.message)+'</p>'});
</script>
